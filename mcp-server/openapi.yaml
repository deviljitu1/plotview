openapi: 3.1.0
info:
  title: PlotView API
  description: API to manage PlotView real estate projects and plots.
  version: 1.0.0
servers:
  - url: https://your-render-url.onrender.com
    description: Production Server (Replace with your actual URL)
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
security:
  - ApiKeyAuth: []
paths:
  /api/projects:
    get:
      summary: List all projects
      operationId: listProjects
      responses:
        "200":
          description: A list of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    slug:
                      type: string
                    clientName:
                      type: string
  /api/projects/{projectId}:
    get:
      summary: Get project details
      operationId: getProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project details including plots
  /api/projects/{projectId}/plots:
    post:
      summary: Add a plot to a project
      operationId: addPlot
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                area:
                  type: number
                size:
                  type: string
                type:
                  type: string
                status:
                  type: string
                facing:
                  type: string
              required:
                - name
      responses:
        "200":
          description: Plot added successfully
  /api/projects/{projectId}/plots/{plotId}/status:
    put:
      summary: Update the status of a plot
      operationId: updatePlotStatus
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: plotId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
              required:
                - status
      responses:
        "200":
          description: Status updated successfully
